<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 11</title>
    <!-- Fonte google rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- Booststrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="form-cadastro">
      <form action="nome" method="get">
        <label for="Nome completo">Nome completo</label><br />
        <input type="text" name="nome-completo" placeholder="Digite seu nome aqui"/><br />
        <label for="senha">Senha</label><br />
        <input type="password" name="senha" minlength="8" /><br />
        <label for="data-nascimento">Data de nascimento</label><br />
        <input type="date" name="data-nascimento" /><br />
        <label for="descrição">Fale sobre você</label><br />
        <textarea name="descrição" rows="5" cols="10"></textarea><br />
        <label for="telefone">Telefone</label><br />
        <input type="number" name="telefone" id="" /><br />
        <label for="imagem">Foto de perfil</label><br />
        <input type="file" src="foto" size="10mb" accept=".pdf" /><br />
        <label for="email">Email</label><br /><br />
        <input type="email" name="email" id="" /><br />
        <button type="submit">Enviar formulário</button>
      </form>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
