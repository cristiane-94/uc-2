<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comida típica nordestina</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <meta
      name="description"
      content="Aula 06 - Aprofundando os conhecimentos em flexbox!"
    />

  <body>
    <main>
      <div class="card">
        <h2>Cuscuz com carne de sol na nata</h2>
        <h4>
          Uma das combinações mais icônicas e afetivas da culinária
          nordestina. O contraste da massa de milho quentinha com a suculência
          da carne envolta na nata fresca cria um prato
          irresistível
        </h4>
        <figure>
          <img
            src="./assets/img/cuscuz-com-carne-de-sol.png"
            alt="Prato composto por cuscuz coberto por molho cremoso de nata com fios de carne de sol desfiada. Sobre a cobertura há folhas verdes de ervas e uma pimeita de cheiro. O alimento está servido em uma superfície de madeira, com fundo desfocado destacando o prato em primeiro plano." height="400px"
          />
          <figcaption>O melhor da culinária nordestina</figcaption>
          <a
            href="https://www.sabornamesa.com.br/receita-de-carnes/carne-de-sol-na-nata"
            ><button>Clique para ver a receita completa</button></a
          >
        </figure>
      </div>
    </main>
