<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 06 - aprofundando um flexbox</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <meta
      name="description"
      content="Aula 06 - Aprofundando os conhecimentos em flexbox!"
    />
    <meta name="Author" content="Cristiane Chaves" />
  </head>
  <body>
    <main>
      <div class="linha">
        <div class="card">
          <h3>Duda beat, cantora e compositora brasileira</h3>
          <a
            href="https://www.youtube.com/watch?v=5ZBQKrBDids&list=RD5ZBQKrBDids&start_radio=1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <figure>
              <img
                src="./assets/img/dudabeat.jpg"
                alt="Imagem close-up da artista Duda Beat com cabelos longos e claros, maquiagem marcante nos olhos com cílios destacados e lábios em tom claro, diante de um fundo desfocado com iluminação em tons de rosa, roxo e branco"
              />
              <figcaption>Duda beat, terceiro album</figcaption>
            </figure>
            <button>Ir para os outros albuns</button>
          </a>
        </div>
        <div class="card">
          <h3>Nasceu em Recife</h3>
          <figure>
            <img
              src="./assets/img/recife.jpg"
              alt="Vista aérea do centro de Recife, com rios cortando a cidade, diversas pontes interligando os bairros, áreas verdes, edifícios históricos e modernos, além do litoral e do oceano ao fundo sob céu parcialmente nublado."
              height="200ptx"
            />
            <figcaption>Recife, capital de Pernambuco/BR</figcaption>
          </figure>
          <button>Ver pelo google maps</button>
          
      </div>
    </main>
    <footer></footer>
  </body>
</html>
